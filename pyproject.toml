[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "specspine"
version = "0.2.0"
description = "A spec-driven AI development hub that connects intent, specs, execution, and quality."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "dengshijun", email = "dengshijun1992@gmail.com" }
]
keywords = ["ai", "spec", "spec-driven-development", "developer-tools", "agent-workflow"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance"
]

[project.scripts]
specspine = "specspine.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
